<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="J.A.R.V.I.S." />
  <title>J.A.R.V.I.S.</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background: #000408;
      color: #00f3ff;
      font-family: 'Rajdhani', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 22px);
    }
    /* Orqa fondagi nozik gologramma setka */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 45%, rgba(0, 243, 255, 0.14) 0%, transparent 60%),
        linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 36px 36px, 36px 36px;
      pointer-events: none;
    }

    .hud-font { font-family: 'Orbitron', sans-serif; }

    /* Yuqori minimal chiziq */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      letter-spacing: 2px;
      opacity: 0.75;
      z-index: 10;
    }
    .key-btn {
      background: transparent;
      border: 1px solid rgba(0, 243, 255, 0.35);
      color: #00f3ff;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 10px;
      letter-spacing: 1.5px;
    }

    /* Markaziy Kinodagi Gologramma Sfera */
    .core-stage {
      position: relative;
      width: 290px;
      height: 290px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .ring {
      position: absolute;
      border-radius: 50%;
      transition: all 0.4s ease;
    }
    .r1 {
      width: 280px; height: 280px;
      border: 1px solid rgba(0, 243, 255, 0.25);
      border-top: 2px solid #00f3ff;
      border-bottom: 2px solid #00f3ff;
      animation: cw 18s linear infinite;
    }
    .r2 {
      width: 235px; height: 235px;
      border: 2px dashed rgba(0, 243, 255, 0.45);
      animation: ccw 12s linear infinite;
    }
    .r3 {
      width: 185px; height: 185px;
      border: 1px solid rgba(0, 243, 255, 0.2);
      border-left: 3px solid #00f3ff;
      border-right: 3px solid #00f3ff;
      animation: cw 7s linear infinite;
    }
    .r4 {
      width: 135px; height: 135px;
      border: 1px dotted rgba(0, 243, 255, 0.6);
      animation: ccw 5s linear infinite;
    }
    .nucleus {
      width: 82px; height: 82px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #00f3ff 45%, rgba(0, 243, 255, 0.05) 75%);
      box-shadow: 0 0 45px rgba(0, 243, 255, 0.8), inset 0 0 18px #fff;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    /* Eshitish holati (Qizil-Oltin impuls) */
    .listening .r1, .listening .r3 { border-color: #ffaa00; }
    .listening .nucleus {
      background: radial-gradient(circle, #fff 0%, #ffaa00 50%, transparent 80%);
      box-shadow: 0 0 65px #ffaa00;
      transform: scale(1.14);
    }

    /* Gapirish holati (To'lqinlanish) */
    .speaking .nucleus {
      animation: pulseSpeak 0.45s ease-in-out infinite alternate;
    }

    @keyframes cw { 100% { transform: rotate(360deg); } }
    @keyframes ccw { 100% { transform: rotate(-360deg); } }
    @keyframes pulseSpeak {
      from { transform: scale(0.95); box-shadow: 0 0 35px #00f3ff; }
      to { transform: scale(1.22); box-shadow: 0 0 75px #00f3ff; }
    }

    /* Subtitr ko'rinishidagi javob oynasi */
    .subtitle-box {
      width: 100%;
      max-width: 420px;
      text-align: center;
      min-height: 90px;
      max-height: 150px;
      overflow-y: auto;
      padding: 0 10px;
      z-index: 10;
    }
    .status-tag {
      font-size: 10px;
      letter-spacing: 3px;
      opacity: 0.6;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .jarvis-text {
      font-size: 17px;
      line-height: 1.45;
      color: #d8fcff;
      text-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
    }

    /* Pastki yashirin-minimal kiritish chizig'i */
    .bottom-input {
      width: 100%;
      max-width: 420px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(0, 243, 255, 0.35);
      padding: 6px 4px;
      z-index: 10;
    }
    .bottom-input input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #00f3ff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      letter-spacing: 0.5px;
    }
    .bottom-input input::placeholder {
      color: rgba(0, 243, 255, 0.3);
    }
    .send-arrow {
      background: transparent;
      border: none;
      color: #00f3ff;
      font-size: 18px;
      padding-left: 10px;
    }

    /* API Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 4, 8, 0.94);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 50;
    }
    .modal.open { display: flex; }
    .modal input {
      width: 100%;
      max-width: 340px;
      background: rgba(0, 243, 255, 0.06);
      border: 1px solid #00f3ff;
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      margin: 14px 0;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- Yuqori minimal HUD -->
  <div class="top-bar hud-font">
    <span>J.A.R.V.I.S. // MK-85</span>
    <button onclick="openKeyModal()" class="key-btn hud-font">API KEY</button>
  </div>

  <!-- Markaziy Gologramma Reaktor -->
  <div id="stage" class="core-stage" onclick="activateJarvis()">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="ring r3"></div>
    <div class="ring r4"></div>
    <div class="nucleus"></div>
  </div>

  <!-- Kinodagi Subtitr Maydoni -->
  <div class="subtitle-box">
    <div id="state-label" class="status-tag hud-font">STANDBY • BOSING YOKI "HEY JARVIS"</div>
    <div id="output-text" class="jarvis-text">Tizim shay, janob Bexzod.</div>
  </div>

  <!-- Minimal matnli buyruq chizig'i -->
  <div class="bottom-input">
    <input id="cmd-input" type="text" placeholder="Buyruq..." onkeypress="if(event.key==='Enter') sendText()" />
    <button onclick="sendText()" class="send-arrow">➤</button>
  </div>

  <!-- API Kalit Oynasi -->
  <div id="key-modal" class="modal">
    <p class="hud-font text-xs tracking-widest">GEMINI API KALIT (AIzaSy...)</p>
    <input id="key-field" type="password" placeholder="AIzaSy..." />
    <div style="display:flex; gap:12px;">
      <button onclick="saveKey()" class="key-btn hud-font" style="padding:8px 18px;">SAQLASH</button>
      <button onclick="closeKeyModal()" class="key-btn hud-font" style="padding:8px 18px; border-color:#555; color:#888;">YOPISH</button>
    </div>
  </div>

  <script>
    let apiKey = localStorage.getItem('jarvis_clean_key') || '';
    const stage = document.getElementById('stage');
    const stateLabel = document.getElementById('state-label');
    const outputText = document.getElementById('output-text');

    function openKeyModal() {
      document.getElementById('key-field').value = apiKey;
      document.getElementById('key-modal').classList.add('open');
    }
    function closeKeyModal() {
      document.getElementById('key-modal').classList.remove('open');
    }
    function saveKey() {
      apiKey = document.getElementById('key-field').value.trim();
      localStorage.setItem('jarvis_clean_key', apiKey);
      closeKeyModal();
      setReply("API yadrosi ulandi, janob Bexzod.");
    }

    // Ovoz sintezatori (iPhone ovozida gapirish)
    function speak(text) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      // Inglizcha yoki ruscha/o'zbekcha ohangni avtomatik tanlash
      const isEnglish = /^[A-Za-z0-9\s.,!?'"-]+$/.test(text);
      utter.lang = isEnglish ? 'en-GB' : 'ru-RU';
      utter.rate = 1.02;
      utter.pitch = 0.9;

      utter.onstart = () => stage.classList.add('speaking');
      utter.onend = () => stage.classList.remove('speaking');
      utter.onerror = () => stage.classList.remove('speaking');

      window.speechSynthesis.speak(utter);
    }

    function setReply(text) {
      outputText.innerText = text;
      speak(text);
    }

    // "Hey Jarvis" va ovozli buyruq tizimi
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let wakeMode = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        stage.classList.add('listening');
        stateLabel.innerText = wakeMode ? 'TINGLAMOQDA ("HEY JARVIS")...' : 'ESHITMOQDAMAN...';
      };

      recognition.onend = () => {
        stage.classList.remove('listening');
        if (wakeMode) {
          try { recognition.start(); } catch (e) {}
        } else {
          stateLabel.innerText = 'STANDBY • BOSING';
        }
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript.trim();
        const lower = transcript.toLowerCase();

        if (wakeMode) {
          if (lower.includes('jarvis')) {
            wakeMode = false;
            const cleanCmd = lower.replace(/hey jarvis|jarvis/gi, '').trim();
            if (cleanCmd.length > 1) {
              askJarvis(cleanCmd);
            } else {
              setReply("Yes, sir?");
              setTimeout(() => { try { recognition.start(); } catch(e){} }, 1200);
            }
          }
        } else {
          askJarvis(transcript);
        }
      };
    }

    function activateJarvis() {
      // iPhone audio blokini ochish uchun birinchi bosishda ovozni uyg'otish
      const unlock = new SpeechSynthesisUtterance("");
      window.speechSynthesis.speak(unlock);

      if (!recognition) {
        setReply("Mikrofon bu brauzerda bloklangan, pastdan yozing.");
        return;
      }
      wakeMode = false;
      try { recognition.start(); } catch (e) {}
    }

    function sendText() {
      const inp = document.getElementById('cmd-input');
      const val = inp.value.trim();
      if (!val) return;
      inp.value = '';
      askJarvis(val);
    }

    async function askJarvis(prompt) {
      stateLabel.innerText = 'PROCESSING...';
      outputText.innerText = `"${prompt}"`;

      if (!apiKey || !apiKey.startsWith('AIza')) {
        setReply("Janob Bexzod, yuqoridagi API KEY tugmasini bosib, AIzaSy bilan boshlanuvchi haqiqiy Gemini API kalitini kiriting.");
        stateLabel.innerText = 'API KEY REQUIRED';
        return;
      }

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: `Sen Tony Starkning J.A.R.V.I.S. sun'iy intellektisan. Foydalanuvchi Bexzodga kinodagidek qisqa, aqlli, lo'nda va hurmat bilan (janob Bexzod deb) javob ber. Javob 2-3 gapdan oshmasin, chunki ovozda o'qiladi. Savol: ${prompt}`
              }]
            }]
          })
        });

        const data = await res.json();
        if (data.error) {
          setReply("Xatolik: " + data.error.message);
        } else {
          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Tushunmadim, janob.";
          setReply(reply.replace(/\*/g, ''));
        }
      } catch (e) {
        setReply("Aloqa uzildi, janob.");
      }
      stateLabel.innerText = 'ONLINE';
    }
  </script>
</body>
</html>
